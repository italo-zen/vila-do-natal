# Release do jogo (ADR-002 seção 1; CLAUDE.md, "Releases"; GDD 19.7).
# Dispara em tag vX.Y.Z (publica no GitHub Pages e como GitHub Release) e manualmente
# (workflow_dispatch: ensaia testes e build, sem publicar). Nunca dispara em push de branch.
# Ações fixadas por SHA de commit; o comentário ao lado é a versão major usada.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verificar:
    name: Testes, build e verificação da release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Conferir a tag (formato vX.Y.Z e commit na main)
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "Execução manual, sem tag: o build é ensaiado e nada é publicado."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::A tag '$REF_NAME' não segue vX.Y.Z (sem sufixo de pré-lançamento, GDD 19.7.1)."
            exit 1
          fi
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::A tag $REF_NAME não aponta para um commit da main."
            exit 1
          fi
          echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Instalar Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Antes dos testes: tests/qa-gancho.test.ts lê dist-playtest/index.html.
      - name: Build de playtest e checagem do gancho
        run: npm run build:playtest

      - name: Testes (npm test)
        run: npm test

      - name: Novo mapa entra só pelo manifesto (item 013)
        run: npx vitest run tests/application/conteudo.test.ts -t "novo mapa"

      - name: Conteúdo (planta do Tiled, sem alterar arquivos)
        run: npm run verificar:conteudo

      - name: Perfil de arte HD
        run: npm run validar:perfil -- hd-480x352

      # O verificador de áudio usa /usr/bin/python3 com numpy (1.26.4, a versão do meta) e ffmpeg com libmp3lame.
      - name: Áudio (AU10 e AU11; sem escrever arquivos)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg python3-numpy
          npm run verificar:audio

      - name: Build de release
        run: npm run build:release

      - name: Tamanho do HTML e do áudio (GDD 19.2.6)
        run: npm run verificar:tamanho

      - name: Verificação da release (versão, CHANGELOG, gancho, localStorage, nomes)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then
            npm run verificar:release -- --tag "$TAG"
          else
            npm run verificar:release
          fi

      - name: Guardar o HTML de release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-html
          path: dist-release/index.html
          if-no-files-found: error
          retention-days: 90

  github-release:
    name: GitHub Release
    needs: verificar
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Baixar o repositório (para o CHANGELOG)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Baixar o HTML de release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-html
          path: release

      - name: Criar a GitHub Release com a seção do CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSAO="${TAG#v}"
          NOTAS="$RUNNER_TEMP/notas.md"
          ARQUIVO="$RUNNER_TEMP/vila-do-natal-$TAG.html"
          node tools/changelog.mjs --versao "$VERSAO" > "$NOTAS"
          cp release/index.html "$ARQUIVO"
          gh release create "$TAG" "$ARQUIVO" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$NOTAS"

  pages:
    name: GitHub Pages
    needs: verificar
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Baixar o HTML de release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-html
          path: site

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: Publicar no GitHub Pages
        id: publicar
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
